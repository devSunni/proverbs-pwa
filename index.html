<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FF6B4A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="어린이 속담" />
  <meta name="description" content="찹이 패밀리와 함께 준우·지우가 배우는 초등 필수 속담 100개 오프라인 학습 PWA" />
  <title>읽으면서 바로 써먹는 어린이 속담 | 초등 어휘력 PWA</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="./data/series-registry.js"></script>
  <script src="./data/proverbs.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap');
    :root {
      --bg-cream: #FFFBF0;
      --sky-book: #74C0FC;
      --sky-deep: #1DA1F2;
      --coral: #FF6B4A;
      --pouch: #F68372;
      --sunny: #FFE033;
      --mint: #2EC4B6;
      --pink: #FB7185;
      --ink: #222222;
      --comic-border: 2.5px solid #222222;
      --comic-shadow: 0 4px 0 #222222;
      --comic-shadow-sm: 0 2px 0 #222222;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
      background-color: var(--bg-cream);
      background-image: radial-gradient(rgba(255, 107, 74, 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--ink);
      overflow-x: hidden;
      max-width: 100vw;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior-y: contain;
    }
    img, svg, button {
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      user-select: none;
    }
    input, textarea, select {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }
    .font-title {
      font-family: 'Jua', 'Noto Sans KR', sans-serif;
    }
    /* Book-cover comic card & button styles */
    .comic-card {
      border: var(--comic-border);
      box-shadow: var(--comic-shadow);
    }
    .comic-btn {
      border: 2px solid #222222;
      box-shadow: var(--comic-shadow-sm);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
    }
    .comic-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 0 0 #222222;
    }
    .card-shadow {
      border: 2px solid #222222;
      box-shadow: 0 3px 0 #222222;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.15s ease;
    }
    .card-shadow:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #222222;
    }
    .book-word-blue {
      color: #1DA1F2;
      -webkit-text-stroke: 1px #222222;
      text-shadow: 2px 2px 0 #222222;
    }
    .book-word-yellow {
      color: #FFE033;
      -webkit-text-stroke: 1px #222222;
      text-shadow: 2px 2px 0 #222222;
    }
    .book-hero {
      background:
        radial-gradient(circle at 88% 18%, rgba(255, 224, 51, 0.35) 0%, transparent 32%),
        linear-gradient(135deg, #74C0FC 0%, #99D5FF 24%, #FF9B85 24.5%, #F68372 100%);
      border: 3px solid #222222;
      box-shadow: 0 5px 0 #222222;
    }
    .comic-burst {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #FFE033;
      color: #222222;
      border: 2px solid #222222;
      box-shadow: 2px 2px 0 #222222;
      transform: rotate(6deg);
    }
    .profile-switch {
      display: inline-flex;
      background: #F3F4F6;
      border: 2px solid #222222;
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }
    .profile-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      color: #555555;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .profile-btn.active-junwoo {
      background: #1DA1F2;
      color: #FFFFFF;
      box-shadow: 0 1px 0 #222222;
    }
    .profile-btn.active-jiwoo {
      background: #FB7185;
      color: #FFFFFF;
      box-shadow: 0 1px 0 #222222;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: popIn 0.2s ease-out; }

    /* Narrow phone / Z Fold cover screen */
    @media (max-width: 390px) {
      .header-title-text { font-size: 15px; }
      .tab-btn { padding: 6px 10px; font-size: 12px; }
      .profile-btn { padding: 4px 8px; font-size: 11px; }
    }

    /* Tablet & Z Fold unfolded landscape */
    @media (min-width: 768px) {
      .quiz-choice-btn { min-height: 76px; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-[#FFFBF0]/95 backdrop-blur border-b-[2.5px] border-[#222222]">
    <div class="max-w-5xl lg:max-w-6xl mx-auto px-3 sm:px-4 py-2.5 flex items-center justify-between gap-2 flex-wrap">
      <div class="flex items-center gap-2.5 min-w-0">
        <img src="./assets/chabi-mascot.jpg"
             alt="찹이 마스코트"
             class="w-11 h-11 rounded-2xl object-cover border-2 border-[#222222] shadow-[2px_2px_0_#222] shrink-0 bg-white" />
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <h1 id="headerBookTitle" class="font-title header-title-text text-lg sm:text-xl text-[#222222] leading-tight truncate">
              읽으면서 바로 써먹는 <span class="book-word-blue">어린이</span> <span class="book-word-yellow">속담</span>
            </h1>
            <span id="headerCountBadge" class="comic-burst text-[11px] font-black px-1.5 py-0.5 rounded-lg shrink-0">!! 100</span>
          </div>
          <p class="text-[11px] sm:text-xs text-slate-600 font-semibold truncate">찹이 패밀리와 함께하는 준우·지우 어휘력 PWA</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0 flex-wrap">
        <!-- Junwoo / Jiwoo Dual Profile Switcher -->
        <div class="profile-switch" role="group" aria-label="프로필 전환">
          <button id="btnProfileJunwoo" type="button" class="profile-btn" data-profile="junwoo">👦 준우</button>
          <button id="btnProfileJiwoo" type="button" class="profile-btn" data-profile="jiwoo">👧 지우</button>
        </div>
        <button id="btnSoundToggle" type="button"
                aria-label="소리 켜기/끄기"
                class="comic-btn px-2.5 py-1.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-[#222222] text-xs font-extrabold flex items-center gap-1">
          <span id="soundIcon">🔊</span>
          <span class="hidden sm:inline" id="soundLabel">소리 켜짐</span>
        </button>
        <button id="btnInstallHeader" type="button"
                class="comic-btn px-2.5 sm:px-3 py-1.5 rounded-xl bg-[#FF6B4A] hover:bg-[#f05837] text-white text-xs font-extrabold flex items-center gap-1">
          <span>📲</span>
          <span class="hidden sm:inline">앱 설치</span>
        </button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="max-w-5xl lg:max-w-6xl mx-auto px-3 sm:px-4 pb-2.5 flex items-center justify-between gap-2 flex-wrap">
      <nav class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5" aria-label="학습 메뉴">
        <button data-tab="explore" class="tab-btn comic-btn px-3.5 py-2 rounded-xl text-sm font-extrabold whitespace-nowrap">📚 속담 도감</button>
        <button data-tab="quiz" class="tab-btn comic-btn px-3.5 py-2 rounded-xl text-sm font-extrabold whitespace-nowrap">🎯 속담 퀴즈</button>
        <button data-tab="practice" class="tab-btn comic-btn px-3.5 py-2 rounded-xl text-sm font-extrabold whitespace-nowrap">✏️ 따라쓰기 미션</button>
        <button data-tab="progress" class="tab-btn comic-btn px-3.5 py-2 rounded-xl text-sm font-extrabold whitespace-nowrap">🏆 내 학습장</button>
      </nav>
      <div id="seriesSwitcher" class="flex items-center gap-1 text-xs text-slate-700 bg-white px-2 py-1 rounded-xl border-2 border-[#222222] overflow-x-auto no-scrollbar max-w-full" aria-label="시리즈 선택"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-5xl lg:max-w-6xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-5">
    <!-- Hero Banner (Book Cover Vibe - Shown on Explore) -->
    <section id="heroSection" class="mb-5 book-hero rounded-3xl p-4 sm:p-5 flex flex-col sm:flex-row items-center gap-4">
      <img src="./assets/chabi-hero.jpg"
           alt="찹이 패밀리 속담 공부"
           class="w-full sm:w-56 h-36 sm:h-32 object-cover rounded-2xl border-[2.5px] border-[#222222] shadow-[3px_3px_0_#222] shrink-0 bg-white" />
      <div class="flex-1 min-w-0 text-center sm:text-left">
        <div class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-white border-2 border-[#222222] text-xs font-extrabold text-[#222222] mb-2 shadow-[2px_2px_0_#222]">
          <span id="heroProfileBadge">👦 준우의 속담 보물주머니</span>
        </div>
        <h2 id="heroTagline" class="font-title text-xl sm:text-2xl text-white drop-shadow-[1px_2px_0_#222] mb-1">
          속담 100개, 읽고 바로 써먹자! <span class="text-[#FFE033]">척! 찰칵!</span>
        </h2>
        <p id="heroSubtext" class="text-xs sm:text-sm text-white/95 font-bold mb-3">
          🍡 찹이 · 두야 · 모네 · 쎄세 · 래야 · 뽀기와 카드를 열어 뜻을 상상하고 퀴즈에 도전해 봐요!
        </p>
        <div class="flex items-center justify-center sm:justify-start gap-2.5 flex-wrap">
          <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border-2 border-[#222222] shadow-[2px_2px_0_#222] text-xs font-extrabold">
            <span class="text-emerald-600">⭐ 외운 속담</span>
            <span id="heroMasteredCount" class="text-base text-[#222222]">0 / 100</span>
          </div>
          <button id="btnQuickQuiz" type="button" class="comic-btn px-3.5 py-2 rounded-xl bg-[#FFE033] hover:bg-[#ffd60a] text-[#222222] text-xs font-black">
            ⚡ 오늘의 10문제 도전!
          </button>
        </div>
      </div>
    </section>

    <!-- Dynamic View Container -->
    <div id="viewContainer"></div>
  </main>

  <!-- Proverb Detail Modal -->
  <div id="proverbModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/55 backdrop-blur-sm p-3 sm:p-4">
    <div class="bg-[#FFFBF0] rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto comic-card animate-pop">
      <div id="proverbModalBody" class="p-5 sm:p-6"></div>
    </div>
  </div>

  <!-- PWA Install / Info Modal -->
  <div id="installModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/55 backdrop-blur-sm p-4">
    <div class="bg-white rounded-3xl max-w-md w-full comic-card p-6 animate-pop">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-title text-xl text-[#222222]">📲 홈 화면에 앱 설치하기</h3>
        <button id="btnCloseInstall" type="button" class="comic-btn px-2 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-black">✕</button>
      </div>
      <div id="installModalContent" class="text-sm text-slate-700 space-y-3"></div>
    </div>
  </div>

  <!-- Confirm Reset Modal -->
  <div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/55 backdrop-blur-sm p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full comic-card p-6 animate-pop">
      <h3 id="resetModalTitle" class="font-title text-lg text-[#222222] mb-2">학습 기록을 초기화할까요?</h3>
      <p class="text-sm text-slate-600 mb-5">현재 선택된 프로필의 외운 속담, 즐겨찾기, 오답노트 기록이 처음 상태로 돌아갑니다.</p>
      <div class="flex justify-end gap-2">
        <button id="btnCancelReset" type="button" class="comic-btn px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-extrabold">취소</button>
        <button id="btnConfirmReset" type="button" class="comic-btn px-4 py-2 rounded-xl bg-rose-500 hover:bg-rose-600 text-white text-sm font-extrabold">초기화하기</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-2xl bg-[#222222] text-white text-sm font-extrabold border-2 border-[#FFE033] shadow-lg whitespace-nowrap max-w-[92vw] truncate"></div>

  <script>
    // ==========================================
    // 1. Extensible Series Pack Loader
    // ==========================================
    const SERIES_REGISTRY = window.SERIES_REGISTRY || [];
    const SERIES_DATA = window.SERIES_DATA || {};

    function getPack(packId) {
      return SERIES_DATA[packId] || SERIES_DATA.proverbs || Object.values(SERIES_DATA)[0];
    }

    function getActivePack() {
      return getPack(store.currentPackId);
    }

    function getActiveItems() {
      const pack = getActivePack();
      return pack ? pack.items : [];
    }

    function getActiveGroups() {
      const pack = getActivePack();
      return pack ? pack.groups : [];
    }

    const PROFILES = {
      junwoo: { id: 'junwoo', name: '준우', emoji: '👦', color: '#1DA1F2' },
      jiwoo: { id: 'jiwoo', name: '지우', emoji: '👧', color: '#FB7185' }
    };

    // ==========================================
    // 2. State, Dual Profiles & UI Persistence
    // ==========================================
    const STORAGE_KEY = 'chabi_series_pwa_v3';
    const LEGACY_V2_KEY = 'chabi_proverbs_pwa_v2';
    const LEGACY_V1_KEY = 'chabi_proverbs_pwa_v1';
    let deferredInstallPrompt = null;

    function createEmptyPackProgress() {
      return {
        masteredIds: [],
        favoriteIds: [],
        wrongIds: [],
        practicedIds: [],
        bestStreak: 0,
        ui: {
          activeTab: 'explore',
          consonant: 'all',
          filterStatus: 'all',
          searchQuery: '',
          quizMode: 'meaning',
          quizScope: 'all',
          practiceSelectedId: null
        }
      };
    }

    function createEmptyProfileData() {
      return {
        packs: {
          proverbs: createEmptyPackProgress()
        }
      };
    }

    const store = {
      currentProfile: 'junwoo',
      currentPackId: 'proverbs',
      soundEnabled: true,
      profiles: {
        junwoo: createEmptyProfileData(),
        jiwoo: createEmptyProfileData()
      }
    };

    const state = {
      activeTab: 'explore',
      consonant: 'all',
      filterStatus: 'all',
      searchQuery: '',
      masteredIds: new Set(),
      favoriteIds: new Set(),
      wrongIds: new Set(),
      practicedIds: new Set(),
      bestStreak: 0,
      soundEnabled: true,
      modalId: null,
      modalRevealed: false,
      modalDictation: '',
      modalDictationResult: null,
      quiz: {
        mode: 'meaning',
        scope: 'all',
        started: false,
        questions: [],
        currentIdx: 0,
        score: 0,
        streak: 0,
        maxStreak: 0,
        answered: false,
        selectedOption: null,
        finished: false
      },
      practice: {
        selectedId: null,
        inputVal: '',
        checked: false,
        isCorrect: false
      }
    };

    function getActiveProfileMeta() {
      return PROFILES[store.currentProfile] || PROFILES.junwoo;
    }

    function getActivePackProgress() {
      if (!store.profiles[store.currentProfile]) {
        store.profiles[store.currentProfile] = createEmptyProfileData();
      }
      const prof = store.profiles[store.currentProfile];
      if (!prof.packs) prof.packs = {};
      if (!prof.packs[store.currentPackId]) {
        prof.packs[store.currentPackId] = createEmptyPackProgress();
      }
      return prof.packs[store.currentPackId];
    }

    function restoreUIStateFromProfile() {
      const p = getActivePackProgress();
      state.masteredIds = new Set(Array.isArray(p.masteredIds) ? p.masteredIds : []);
      state.favoriteIds = new Set(Array.isArray(p.favoriteIds) ? p.favoriteIds : []);
      state.wrongIds = new Set(Array.isArray(p.wrongIds) ? p.wrongIds : []);
      state.practicedIds = new Set(Array.isArray(p.practicedIds) ? p.practicedIds : []);
      state.bestStreak = Number(p.bestStreak || 0);
      state.soundEnabled = store.soundEnabled;

      const ui = p.ui || {};
      const validTabs = ['explore', 'quiz', 'practice', 'progress'];
      state.activeTab = validTabs.includes(ui.activeTab) ? ui.activeTab : 'explore';
      state.consonant = ui.consonant || 'all';
      state.filterStatus = ui.filterStatus || 'all';
      state.searchQuery = typeof ui.searchQuery === 'string' ? ui.searchQuery : '';
      state.quiz.mode = ui.quizMode || 'meaning';
      state.quiz.scope = ui.quizScope || 'all';
      state.quiz.started = false;
      state.quiz.finished = false;
      state.practice.selectedId = ui.practiceSelectedId || null;
      state.practice.inputVal = '';
      state.practice.checked = false;
    }

    function persistUIState() {
      const p = getActivePackProgress();
      p.masteredIds = [...state.masteredIds];
      p.favoriteIds = [...state.favoriteIds];
      p.wrongIds = [...state.wrongIds];
      p.practicedIds = [...state.practicedIds];
      p.bestStreak = state.bestStreak;
      p.ui = {
        activeTab: state.activeTab,
        consonant: state.consonant,
        filterStatus: state.filterStatus,
        searchQuery: state.searchQuery,
        quizMode: state.quiz.mode,
        quizScope: state.quiz.scope,
        practiceSelectedId: state.practice.selectedId
      };
      store.soundEnabled = state.soundEnabled;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.currentProfile && PROFILES[parsed.currentProfile]) store.currentProfile = parsed.currentProfile;
          if (parsed.currentPackId && SERIES_DATA[parsed.currentPackId]) store.currentPackId = parsed.currentPackId;
          if (typeof parsed.soundEnabled === 'boolean') store.soundEnabled = parsed.soundEnabled;
          if (parsed.profiles) {
            for (const key of ['junwoo', 'jiwoo']) {
              if (parsed.profiles[key] && parsed.profiles[key].packs) {
                store.profiles[key] = parsed.profiles[key];
              }
            }
          }
        } else {
          const v2Raw = localStorage.getItem(LEGACY_V2_KEY);
          if (v2Raw) {
            const parsed = JSON.parse(v2Raw);
            if (parsed.currentProfile && PROFILES[parsed.currentProfile]) store.currentProfile = parsed.currentProfile;
            if (typeof parsed.soundEnabled === 'boolean') store.soundEnabled = parsed.soundEnabled;
            if (parsed.profiles) {
              for (const key of ['junwoo', 'jiwoo']) {
                if (parsed.profiles[key]) {
                  store.profiles[key].packs.proverbs = Object.assign(createEmptyPackProgress(), parsed.profiles[key]);
                }
              }
            }
          } else {
            const v1Raw = localStorage.getItem(LEGACY_V1_KEY);
            if (v1Raw) {
              const parsed = JSON.parse(v1Raw);
              const jw = store.profiles.junwoo.packs.proverbs;
              if (Array.isArray(parsed.masteredIds)) jw.masteredIds = parsed.masteredIds;
              if (Array.isArray(parsed.favoriteIds)) jw.favoriteIds = parsed.favoriteIds;
              if (Array.isArray(parsed.wrongIds)) jw.wrongIds = parsed.wrongIds;
              if (Array.isArray(parsed.practicedIds)) jw.practicedIds = parsed.practicedIds;
              if (typeof parsed.soundEnabled === 'boolean') store.soundEnabled = parsed.soundEnabled;
            }
          }
        }
      } catch (e) {}
      restoreUIStateFromProfile();
    }

    function saveState() {
      persistUIState();
    }

    function switchProfile(profileId) {
      if (!PROFILES[profileId] || store.currentProfile === profileId) return;
      persistUIState();
      store.currentProfile = profileId;
      restoreUIStateFromProfile();
      persistUIState();
      playTone('ok');
      const meta = getActiveProfileMeta();
      showToast(`${meta.emoji} ${meta.name} 모드로 바꿨어요! 오늘도 화이팅!`);
      render();
    }

    function switchSeriesPack(packId) {
      const entry = SERIES_REGISTRY.find(s => s.id === packId);
      if (!entry) return;

      render();
    }

    // ==========================================
    // 3. Audio (Web Audio SFX & Dual-Tier Korean TTS)
    // ==========================================
    let audioCtx = null;
    function playTone(type) {
      if (!state.soundEnabled) return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (type === 'ok') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.36);
        } else if (type === 'no') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.setValueAtTime(190, now + 0.12);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.29);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.start(now);
          osc.stop(now + 0.1);
        }
      } catch (e) {}
    }

    let cachedKoreanVoice = null;
    let activeUtterance = null;
    let activeSpeakAudio = null;
    let speakWatchdog = null;
    let speakDelayTimer = null;

    function resolveKoreanVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return cachedKoreanVoice;
      const koVoices = voices.filter(v => {
        const lang = (v.lang || '').toLowerCase().replace('_', '-');
        return lang === 'ko-kr' || lang.startsWith('ko');
      });
      if (!koVoices.length) return null;
      cachedKoreanVoice =
        koVoices.find(v => /google|samsung|yuna|sora|heami|sunhi/i.test(v.name) && v.localService) ||
        koVoices.find(v => v.localService) ||
        koVoices.find(v => /google|samsung|yuna|sora|heami|sunhi/i.test(v.name)) ||
        koVoices[0];
      return cachedKoreanVoice;
    }

    if ('speechSynthesis' in window) {
      resolveKoreanVoice();
      if (window.speechSynthesis.addEventListener) {
        window.speechSynthesis.addEventListener('voiceschanged', resolveKoreanVoice);
      }
    }

    function normalizeSpeakText(text) {
      return String(text || '').replace(/[·/]/g, ', ').replace(/\s+/g, ' ').trim();
    }

    function playFallbackTTS(cleanText, userTriggered) {
      if (activeSpeakAudio) {
        try { activeSpeakAudio.pause(); } catch (e) {}
        activeSpeakAudio = null;
      }
      const audio = new Audio();
      audio.referrerPolicy = 'no-referrer';
      audio.src = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ko&client=tw-ob&q=${encodeURIComponent(cleanText.slice(0, 180))}`;
      activeSpeakAudio = audio;
      const p = audio.play && audio.play();
      if (p && p.catch) {
        p.catch(() => {
          if (userTriggered) showToast('🔇 기기에서 한국어 음성 재생이 차단되었어요.');
        });
      }
    }

    function speakKorean(text, { userTriggered = false } = {}) {
      if (!state.soundEnabled) {
        if (userTriggered) showToast('🔇 음소거 상태예요! 상단 소리 버튼을 켜주세요.');
        return;
      }
      const cleanText = normalizeSpeakText(text);
      if (!cleanText) return;
      clearTimeout(speakWatchdog);
      clearTimeout(speakDelayTimer);
      if (activeSpeakAudio) {
        try { activeSpeakAudio.pause(); } catch (e) {}
        activeSpeakAudio = null;
      }

      const synth = window.speechSynthesis;
      if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
        playFallbackTTS(cleanText, userTriggered);
        return;
      }
      const voice = resolveKoreanVoice();
      if ((synth.getVoices() || []).length > 0 && !voice) {
        playFallbackTTS(cleanText, userTriggered);
        return;
      }

      const doSpeak = () => {
        if (synth.paused) synth.resume();
        const u = new SpeechSynthesisUtterance(cleanText);
        u.lang = 'ko-KR';
        u.rate = 0.92;
        u.pitch = 1.04;
        if (voice) u.voice = voice;
        let started = false;
        let settled = false;
        activeUtterance = u;
        u.onstart = () => {
          started = true;
          clearTimeout(speakWatchdog);
        };
        u.onend = () => {
          settled = true;
          clearTimeout(speakWatchdog);
          if (activeUtterance === u) activeUtterance = null;
        };
        u.onerror = (ev) => {
          clearTimeout(speakWatchdog);
          if (activeUtterance === u) activeUtterance = null;
          if (ev && (ev.error === 'canceled' || ev.error === 'interrupted')) return;
          if (!settled) {
            settled = true;
            playFallbackTTS(cleanText, userTriggered);
          }
        };
        synth.speak(u);
        if (synth.paused) synth.resume();
        speakWatchdog = setTimeout(() => {
          if (!started && !settled) {
            settled = true;
            try { synth.cancel(); } catch (e) {}
            playFallbackTTS(cleanText, userTriggered);
          }
        }, 950);
      };

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      if (synth.speaking || synth.pending) {
        synth.cancel();
        if (isIOS) doSpeak();
        else speakDelayTimer = setTimeout(doSpeak, 65);
      } else {
        doSpeak();
      }
    }

    // ==========================================
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');

    function normalizeKor(str) {
      return (str || '').replace(/\s+/g, '').replace(/[.,!?'"~]/g, '').trim();
    }

    function getDailyProverbs() {
      const d = new Date();
      const seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
      const idx1 = seed % getActiveItems().length;
      const idx2 = (seed + 33) % getActiveItems().length;
      const idx3 = (seed + 67) % getActiveItems().length;
      return [getActiveItems()[idx1], getActiveItems()[idx2], getActiveItems()[idx3]];
    }

      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

              }">
              ${isMastered ? '⭐ 외웠어요!' : '☆ 외웠어요 표시'}
            </button>
            <button id="btnToggleFav" type="button"
              class="comic-btn px-3.5 py-2 rounded-xl text-xs font-black ${
                isFav ? 'bg-rose-500 text-white' : 'bg-white text-[#222222] hover:bg-rose-50'
              }">
              ${isFav ? '❤️ 즐겨찾기' : '🤍 즐겨찾기'}
            </button>
          </div>
          <div class="flex items-center gap-1.5">
            <button id="btnPrevModal" type="button" ${prevId ? '' : 'disabled'}
              class="comic-btn px-3 py-2 rounded-xl bg-white hover:bg-amber-50 disabled:opacity-40 text-xs font-black">◀ 이전</button>
            <button id="btnNextModal" type="button" ${nextId ? '' : 'disabled'}
              class="comic-btn px-3 py-2 rounded-xl bg-white hover:bg-amber-50 disabled:opacity-40 text-xs font-black">다음 ▶</button>
          </div>
        </div>
      `;

      document.getElementById('btnCloseModal').addEventListener('click', closeProverbModal);
      document.getElementById('btnSpeakModal').addEventListener('click', () => speakKorean(`${p.t}. ${p.m}`, { userTriggered: true }));
      document.getElementById('btnToggleReveal').addEventListener('click', () => {
        playTone('tap');
        state.modalRevealed = !state.modalRevealed;
        renderProverbModal();
      });
      const dictInput = document.getElementById('modalDictInput');
      dictInput.addEventListener('input', e => { state.modalDictation = e.target.value; });
      const checkModalDict = () => {
        const ok = normalizeKor(state.modalDictation) === normalizeKor(p.t);
        state.modalDictationResult = ok;
        if (ok) {
          playTone('ok');
          state.practicedIds.add(p.id);
          saveState();
        } else {
          playTone('no');
        }
        renderProverbModal();
      };
      document.getElementById('btnCheckModalDict').addEventListener('click', checkModalDict);
      dictInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkModalDict(); });

      document.getElementById('btnToggleMastered').addEventListener('click', () => {
        if (state.masteredIds.has(p.id)) {
          state.masteredIds.delete(p.id);
          playTone('tap');
        } else {
          state.masteredIds.add(p.id);
          playTone('ok');
          showToast(`⭐ ${getActiveProfileMeta().name}가 속담 하나를 정복했어요!`);
        }
        saveState();
        renderProverbModal();
        render();
      });
      document.getElementById('btnToggleFav').addEventListener('click', () => {
        playTone('tap');
        if (state.favoriteIds.has(p.id)) state.favoriteIds.delete(p.id);
        else state.favoriteIds.add(p.id);
        saveState();
        renderProverbModal();
        render();
      });
      if (prevId) document.getElementById('btnPrevModal').addEventListener('click', () => openProverbModal(prevId));
      if (nextId) document.getElementById('btnNextModal').addEventListener('click', () => openProverbModal(nextId));
    }

    // --- Tab 2: Quiz ---
    function startQuiz(mode, scope) {
      let pool = getActiveItems();
      if (scope === 'wrong') {
        pool = getActiveItems().filter(p => state.wrongIds.has(p.id));
        if (pool.length < 4) {
          showToast('오답노트에 4개 이상의 속담이 모여야 오답 퀴즈를 풀 수 있어요!');
          return;
        }
      } else if (scope !== 'all') {
        pool = getActiveItems().filter(p => p.ch === scope);
      }

      const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, Math.min(10, pool.length));
      const questions = shuffled.map(target => {
        const distractors = [...getActiveItems()].filter(x => x.id !== target.id).sort(() => Math.random() - 0.5).slice(0, 3);
        const options = [target, ...distractors].sort(() => Math.random() - 0.5);
        let promptText = '';
        let badge = '';
        if (mode === 'meaning') {
          badge = '🎯 뜻 맞추기';
          promptText = `“${target.t}”의 뜻으로 알맞은 것은 무엇일까요?`;
        } else if (mode === 'blank') {
          badge = '🧩 빈칸 채우기';
          const masked = target.t.replace(target.b, '(  ?  )');
          promptText = `빈칸에 들어갈 알맞은 말은? → “${masked}”`;
        } else {
          badge = '💬 상황극 퀴즈';
          promptText = `${target.s} 이 상황에 딱 맞는 속담은?`;
        }
        return { target, options, promptText, badge };
      });

      state.quiz = {
        mode,
        scope,
        started: true,
        questions,
        currentIdx: 0,
        score: 0,
        streak: 0,
        maxStreak: 0,
        answered: false,
        selectedOption: null,
        finished: false
      };
      persistUIState();
      render();
    }

    function renderQuiz(container) {
      const qz = state.quiz;
      const meta = getActiveProfileMeta();

      if (!qz.started) {
        const modes = [
          { id: 'meaning', title: '🎯 뜻 맞추기', desc: '속담을 보고 알맞은 뜻을 골라요' },
          { id: 'blank', title: '🧩 빈칸 채우기', desc: '속담 속 핵심 낱말을 맞혀요' },
          { id: 'situation', title: '💬 상황극 퀴즈', desc: '찹이 패밀리 이야기에 맞는 속담을 찾아요' }
        ];
        const scopes = [
          { id: 'all', label: '전체 100개' },
          { id: 'ㄱ', label: 'ㄱ' },
          { id: 'ㄴㄷ', label: 'ㄴ·ㄷ' },
          { id: 'ㅁㅂ', label: 'ㅁ·ㅂ' },
          { id: 'ㅅㅇ', label: 'ㅅ·ㅇ' },
          { id: 'ㅈㅎ', label: 'ㅈ~ㅎ' },
          { id: 'wrong', label: `오답노트 (${state.wrongIds.size})` }
        ];

        container.innerHTML = `
          <div class="bg-white rounded-3xl comic-card p-5 sm:p-6 space-y-5">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div>
                <h2 class="font-title text-2xl text-[#222222] mb-0.5">🎯 ${meta.name}의 속담 실력 테스트!</h2>
                <p class="text-sm text-slate-600 font-medium">원하는 퀴즈 유형과 출제 범위를 고르고 10문제에 도전해 보세요.</p>
              </div>
              <span class="comic-burst text-xs font-black px-2.5 py-1 rounded-xl">최고 ${state.bestStreak}콤보!</span>
            </div>

            <div>
              <div class="text-xs font-black text-slate-600 mb-2">1. 퀴즈 유형 선택</div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                ${modes.map(m => `
                  <button type="button" data-qmode="${m.id}" class="qmode-btn comic-btn text-left p-4 rounded-2xl ${
                    qz.mode === m.id ? 'bg-[#FFE033] text-[#222222]' : 'bg-white hover:bg-amber-50 text-[#222222]'
                  }">
                    <div class="font-title text-lg mb-1">${m.title}</div>
                    <div class="text-xs text-slate-700 font-semibold">${m.desc}</div>
                  </button>
                `).join('')}
              </div>
            </div>

            <div>
              <div class="text-xs font-black text-slate-600 mb-2">2. 출제 범위 선택</div>
              <div class="flex flex-wrap gap-2">
                ${scopes.map(s => `
                  <button type="button" data-qscope="${s.id}" class="qscope-btn comic-btn px-3.5 py-2 rounded-xl text-xs font-extrabold ${
                    qz.scope === s.id ? 'bg-[#1DA1F2] text-white' : 'bg-amber-50 text-[#222222] hover:bg-amber-100'
                  }">${s.label}</button>
                `).join('')}
              </div>
            </div>

            <button id="btnStartQuiz" type="button" class="comic-btn w-full py-3.5 rounded-2xl bg-[#FF6B4A] hover:bg-[#f05837] text-white font-title text-xl">
              🚀 퀴즈 시작하기!
            </button>
          </div>
        `;

        container.querySelectorAll('.qmode-btn').forEach(b => b.addEventListener('click', () => {
          playTone('tap');
          state.quiz.mode = b.dataset.qmode;
          persistUIState();
          renderQuiz(container);
        }));
        container.querySelectorAll('.qscope-btn').forEach(b => b.addEventListener('click', () => {
          playTone('tap');
          state.quiz.scope = b.dataset.qscope;
          persistUIState();
          renderQuiz(container);
        }));
        document.getElementById('btnStartQuiz').addEventListener('click', () => {
          playTone('tap');
          startQuiz(state.quiz.mode, state.quiz.scope);
        });
        return;
      }

      if (qz.finished) {
        const total = qz.questions.length;
        const pct = Math.round((qz.score / total) * 100);
        const msg = pct >= 80
          ? `우와! ${meta.name}는 진정한 속담 박사님이네요!`
          : pct >= 50
            ? `잘했어요 ${meta.name}! 조금만 더 복습하면 완벽해요!`
            : `괜찮아요 ${meta.name}! 틀린 속담을 다시 읽어 보면 금방 늘어요!`;
        container.innerHTML = `
          <div class="bg-white rounded-3xl comic-card p-6 sm:p-8 text-center space-y-5 animate-pop">
            <div class="text-5xl">${pct >= 80 ? '🏆' : pct >= 50 ? '🌟' : '🍡'}</div>
            <h2 class="font-title text-2xl sm:text-3xl text-[#222222]">퀴즈 완료! ${qz.score} / ${total}점</h2>
            <p class="text-sm text-slate-700 font-bold">${msg}</p>
            <div class="inline-flex items-center gap-4 bg-[#FFE033]/50 px-5 py-3 rounded-2xl border-2 border-[#222222] text-sm font-black">
              <span>정답률 <strong class="text-[#FF6B4A]">${pct}%</strong></span>
              <span>최대 연속 정답 <strong class="text-[#1DA1F2]">${qz.maxStreak}콤보</strong></span>
            </div>
            <div class="flex flex-col sm:flex-row justify-center gap-3 pt-2">
              <button id="btnRetryQuiz" type="button" class="comic-btn px-5 py-3 rounded-2xl bg-[#FF6B4A] text-white font-black text-sm">🔄 다시 풀기</button>
              <button id="btnQuizHome" type="button" class="comic-btn px-5 py-3 rounded-2xl bg-white text-[#222222] font-black text-sm">⚙️ 다른 유형 고르기</button>
            </div>
          </div>
        `;
        document.getElementById('btnRetryQuiz').addEventListener('click', () => startQuiz(qz.mode, qz.scope));
        document.getElementById('btnQuizHome').addEventListener('click', () => { state.quiz.started = false; renderQuiz(container); });
        return;
      }

      const item = qz.questions[qz.currentIdx];
      const total = qz.questions.length;
      const progressPct = Math.round(((qz.currentIdx + (qz.answered ? 1 : 0)) / total) * 100);

      // Tablet Landscape 2-column split (md:grid-cols-12) so quiz fits in 1280x800 without vertical scrolling
      container.innerHTML = `
        <div class="bg-white rounded-3xl comic-card p-4 sm:p-6">
          <div class="flex items-center justify-between gap-2 mb-3 flex-wrap">
            <span class="px-3 py-1 rounded-xl bg-[#FFE033] border-2 border-[#222222] text-[#222222] text-xs font-black">${item.badge} · ${qz.currentIdx + 1} / ${total}</span>
            <div class="flex items-center gap-3 text-xs font-black">
              <span class="text-[#FF6B4A]">🔥 ${qz.streak}콤보</span>
              <span class="text-emerald-600">점수 ${qz.score}</span>
              <button id="btnQuitQuiz" type="button" class="text-slate-500 hover:text-[#222222] underline">그만하기</button>
            </div>
          </div>

          <div class="w-full h-3 bg-amber-100 border-2 border-[#222222] rounded-full overflow-hidden mb-4">
            <div class="h-full bg-[#2EC4B6] transition-all duration-300" style="width:${progressPct}%"></div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-12 gap-4 sm:gap-5 items-start">
            <!-- Left column: Question Prompt -->
            <div class="md:col-span-5 rounded-2xl bg-sky-50 border-2 border-[#222222] p-4 sm:p-5 space-y-3 shadow-[3px_3px_0_#222]">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-black text-[#1DA1F2]">🍡 문제 카드</span>
                <button id="btnSpeakQuiz" type="button" class="comic-btn px-2.5 py-1 rounded-lg bg-white hover:bg-sky-100 text-[#222222] text-xs font-extrabold">🗣️ 듣기</button>
              </div>
              <h3 class="font-title text-xl sm:text-2xl text-[#222222] leading-snug">${escapeHtml(item.promptText)}</h3>
              ${qz.answered ? `
                <div class="rounded-2xl p-3.5 border-2 border-[#222222] ${qz.selectedOption === item.target.id ? 'bg-emerald-100' : 'bg-rose-100'} animate-pop space-y-1.5">
                  <div class="font-black text-sm ${qz.selectedOption === item.target.id ? 'text-emerald-900' : 'text-rose-900'}">
                    ${qz.selectedOption === item.target.id ? '🎉 정답이에요! 척!' : `아쉬워요! 정답은 “${escapeHtml(item.target.t)}”예요.`}
                  </div>
                  <p class="text-xs text-[#222222] leading-relaxed"><strong>뜻:</strong> ${escapeHtml(item.target.m)}</p>
                  <p class="text-xs text-slate-700"><strong>예문:</strong> ${escapeHtml(item.target.ex)}</p>
                </div>
              ` : `<p class="text-xs text-slate-600 font-semibold">오른쪽 보기 4개 중에서 정답을 눌러 보세요!</p>`}
            </div>

            <!-- Right column: 2x2 Choice Grid + Next Button -->
            <div class="md:col-span-7 space-y-3">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3">
                ${item.options.map((opt, idx) => {
                  let label = opt.t;
                  if (qz.mode === 'meaning') label = opt.m;
                  else if (qz.mode === 'blank') label = opt.b;

                  let btnClass = 'bg-white hover:bg-amber-50 text-[#222222]';
                  if (qz.answered) {
                    if (opt.id === item.target.id) btnClass = 'bg-emerald-200 text-emerald-950 font-black';
                    else if (opt.id === qz.selectedOption) btnClass = 'bg-rose-200 text-rose-950';
                    else btnClass = 'bg-slate-100 text-slate-400';
                  }
                  return `
                    <button type="button" data-opt-id="${opt.id}" ${qz.answered ? 'disabled' : ''}
                      class="quiz-opt quiz-choice-btn comic-btn w-full text-left p-3.5 sm:p-4 rounded-2xl flex items-start gap-2.5 ${btnClass}">
                      <span class="w-6 h-6 rounded-lg bg-[#FFE033] border border-[#222222] text-[#222222] flex items-center justify-center text-xs font-black shrink-0">${idx + 1}</span>
                      <span class="text-sm sm:text-base font-bold leading-snug">${escapeHtml(label)}</span>
                    </button>
                  `;
                }).join('')}
              </div>

              ${qz.answered ? `
                <div class="flex justify-end pt-1">
                  <button id="btnNextQ" type="button" class="comic-btn px-6 py-3 rounded-2xl bg-[#FF6B4A] hover:bg-[#f05837] text-white text-sm font-black">
                    ${qz.currentIdx + 1 < total ? '다음 문제 ▶' : '결과 보기 🏆'}
                  </button>
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `;

      document.getElementById('btnQuitQuiz').addEventListener('click', () => { state.quiz.started = false; renderQuiz(container); });
      document.getElementById('btnSpeakQuiz').addEventListener('click', () => speakKorean(item.promptText, { userTriggered: true }));
      container.querySelectorAll('.quiz-opt').forEach(btn => btn.addEventListener('click', () => {
        const chosen = Number(btn.dataset.optId);
        qz.answered = true;
        qz.selectedOption = chosen;
        if (chosen === item.target.id) {
          qz.score += 1;
          qz.streak += 1;
          qz.maxStreak = Math.max(qz.maxStreak, qz.streak);
          state.bestStreak = Math.max(state.bestStreak, qz.maxStreak);
          state.wrongIds.delete(item.target.id);
          playTone('ok');
        } else {
          qz.streak = 0;
          state.wrongIds.add(item.target.id);
          playTone('no');
        }
        saveState();
        renderQuiz(container);
      }));

      const nextBtn = document.getElementById('btnNextQ');
      if (nextBtn) nextBtn.addEventListener('click', () => {
        if (qz.currentIdx + 1 < total) {
          qz.currentIdx += 1;
          qz.answered = false;
          qz.selectedOption = null;
        } else {
          qz.finished = true;
          if (qz.score / total >= 0.7 && typeof confetti === 'function') {
            confetti({ particleCount: 70, spread: 60, origin: { y: 0.7 } });
          }
        }
        renderQuiz(container);
      });
    }

    // --- Tab 3: Daily Practice & Dictation ---
    function renderPractice(container) {
      const daily = getDailyProverbs();
      if (!state.practice.selectedId || !daily.some(d => d.id === state.practice.selectedId)) {
        state.practice.selectedId = daily[0].id;
      }
      const active = getActiveItems().find(p => p.id === state.practice.selectedId) || daily[0];

      // Tablet Landscape 2-column split (md:grid-cols-12)
      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 sm:gap-5 items-start">
          <!-- Left: Today's 3 Missions -->
          <div class="md:col-span-5 bg-white rounded-3xl comic-card p-5 space-y-3">
            <div>
              <h2 class="font-title text-2xl text-[#222222] mb-1">✏️ 오늘의 따라쓰기 미션</h2>
              <p class="text-xs sm:text-sm text-slate-600 font-medium">오늘 추천된 속담 3개를 소리 내어 읽고 정확히 따라 써 보세요!</p>
            </div>
            <div class="space-y-2.5">
              ${daily.map(p => {
                const done = state.practicedIds.has(p.id);
                const selected = p.id === active.id;
                return `
                  <button type="button" data-prac-id="${p.id}"
                    class="prac-pick comic-btn w-full text-left p-3.5 rounded-2xl ${
                      selected ? 'bg-[#FFE033] text-[#222222]' : 'bg-amber-50/50 hover:bg-amber-100 text-[#222222]'
                    }">
                    <div class="flex items-center justify-between mb-1">
                      <span class="text-xs font-black px-2 py-0.5 rounded-lg bg-white border border-[#222222]">${String(p.id).padStart(2, '0')}번</span>
                      <span class="text-xs font-black ${done ? 'text-emerald-700' : 'text-slate-500'}">${done ? '✅ 완료' : '도전!'}</span>
                    </div>
                    <div class="font-title text-base">${escapeHtml(p.t)}</div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Right: Active Dictation Board -->
          <div class="md:col-span-7 bg-white rounded-3xl comic-card p-5 sm:p-6 space-y-4">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <span class="px-3 py-1 rounded-xl bg-[#2EC4B6] border-2 border-[#222222] text-white text-xs font-black">따라쓰기 연습 · ${String(active.id).padStart(2, '0')}번</span>
              <button id="btnSpeakPrac" type="button" class="comic-btn px-3 py-1.5 rounded-xl bg-sky-100 hover:bg-sky-200 text-[#222222] text-xs font-black">🗣️ 들어보기</button>
            </div>

            <div class="p-4 rounded-2xl bg-amber-50 border-2 border-[#222222]">
              <div class="font-title text-2xl text-[#222222] mb-1">${escapeHtml(active.t)}</div>
              <p class="text-sm text-slate-700 font-medium">${escapeHtml(active.m)}</p>
            </div>

            <div class="space-y-2">
              <label class="block text-xs font-black text-slate-700">위에 적힌 속담을 그대로 입력해 보세요:</label>
              <div class="flex flex-col sm:flex-row gap-2">
                <input id="pracInput" type="text" value="${escapeHtml(state.practice.inputVal)}"
                       placeholder="${escapeHtml(active.t)}"
                       class="flex-1 px-4 py-3 rounded-2xl bg-white border-2 border-[#222222] text-base font-bold focus:outline-none focus:ring-2 focus:ring-[#2EC4B6]" />
                <button id="btnCheckPrac" type="button" class="comic-btn px-6 py-3 rounded-2xl bg-[#FF6B4A] hover:bg-[#f05837] text-white font-black text-sm shrink-0">검사하기</button>
              </div>
            </div>

            ${state.practice.checked ? `
              <div class="p-4 rounded-2xl border-2 border-[#222222] ${state.practice.isCorrect ? 'bg-emerald-100 text-emerald-900' : 'bg-rose-100 text-rose-900'} text-sm font-extrabold animate-pop">
                ${state.practice.isCorrect
                  ? '🎉 완벽해요! 오늘의 따라쓰기 스탬프와 외웠어요 별을 받았어요!'
                  : '아쉬워요! 글자 순서나 맞춤법을 한 번 더 확인해서 적어 보세요.'}
              </div>
            ` : ''}
          </div>
        </div>
      `;

      container.querySelectorAll('.prac-pick').forEach(b => b.addEventListener('click', () => {
        playTone('tap');
        state.practice.selectedId = Number(b.dataset.pracId);
        state.practice.inputVal = '';
        state.practice.checked = false;
        persistUIState();
        renderPractice(container);
      }));
      document.getElementById('btnSpeakPrac').addEventListener('click', () => speakKorean(`${active.t}. ${active.m}`, { userTriggered: true }));
      const pracInput = document.getElementById('pracInput');
      pracInput.addEventListener('input', e => { state.practice.inputVal = e.target.value; });
      const checkPractice = () => {
        const ok = normalizeKor(state.practice.inputVal) === normalizeKor(active.t);
        state.practice.checked = true;
        state.practice.isCorrect = ok;
        if (ok) {
          playTone('ok');
          state.practicedIds.add(active.id);
          state.masteredIds.add(active.id);
          saveState();
        } else {
          playTone('no');
        }
        renderPractice(container);
      };
      document.getElementById('btnCheckPrac').addEventListener('click', checkPractice);
      pracInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkPractice(); });
    }

    // --- Tab 4: Progress & PWA ---
    function renderProgress(container) {
      const meta = getActiveProfileMeta();
      const mCount = state.masteredIds.size;
      const pct = Math.round((mCount / getActiveItems().length) * 100);
      const rank = getRankInfo(mCount);
      const badges = [
        { name: '새싹 탐험가', desc: '속담 5개 이상 외우기', icon: '🌱', unlocked: mCount >= 5 },
        { name: '찹이 단짝', desc: '속담 25개 이상 외우기', icon: '🍡', unlocked: mCount >= 25 },
        { name: '속담 척척박사', desc: '속담 50개 이상 외우기', icon: '🎓', unlocked: mCount >= 50 },
        { name: '국어 왕 중의 왕', desc: '속담 100개 모두 외우기', icon: '👑', unlocked: mCount >= 100 }
      ];

      const chBreakdown = getActiveGroups().filter(g => g.id !== 'all').map(g => {
        const groupItems = getActiveItems().filter(p => p.ch === g.id);
        const done = groupItems.filter(p => state.masteredIds.has(p.id)).length;
        const gPct = Math.round((done / groupItems.length) * 100);
        return `
          <div class="space-y-1">
            <div class="flex justify-between text-xs font-extrabold">
              <span class="text-[#222222]">${g.label}</span>
              <span class="text-slate-600">${done} / ${groupItems.length} (${gPct}%)</span>
            </div>
            <div class="w-full h-2.5 bg-amber-100 border border-[#222222] rounded-full overflow-hidden">
              <div class="h-full bg-[#FF6B4A] transition-all" style="width:${gPct}%"></div>
            </div>
          </div>
        `;
      }).join('');

      const wrongList = getActiveItems().filter(p => state.wrongIds.has(p.id));

      container.innerHTML = `
        <div class="space-y-5">
          <!-- Summary & Badges (2-column on md+) -->
          <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
            <div class="md:col-span-7 bg-white rounded-3xl comic-card p-5 space-y-4">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <div>
                  <h2 class="font-title text-xl text-[#222222]">📊 ${meta.emoji} ${meta.name}의 속담 정복률</h2>
                  <span class="inline-block mt-0.5 text-xs font-black px-2.5 py-0.5 rounded-full bg-[#FFE033] border border-[#222222]">${rank.title}</span>
                </div>
                <span class="text-3xl font-black text-[#FF6B4A]">${pct}%</span>
              </div>
              <div class="w-full h-4 bg-amber-100 border-2 border-[#222222] rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-[#FF6B4A] to-[#FFE033] transition-all" style="width:${pct}%"></div>
              </div>
              <div class="grid grid-cols-3 gap-2 text-center pt-1">
                <div class="p-2.5 rounded-2xl bg-emerald-50 border-2 border-[#222222]">
                  <div class="text-lg font-black text-emerald-700">${mCount}</div>
                  <div class="text-[11px] font-extrabold text-emerald-800">외운 속담</div>
                </div>
                <div class="p-2.5 rounded-2xl bg-sky-50 border-2 border-[#222222]">
                  <div class="text-lg font-black text-[#1DA1F2]">${state.practicedIds.size}</div>
                  <div class="text-[11px] font-extrabold text-sky-800">따라쓰기</div>
                </div>
                <div class="p-2.5 rounded-2xl bg-rose-50 border-2 border-[#222222]">
                  <div class="text-lg font-black text-rose-600">${state.favoriteIds.size}</div>
                  <div class="text-[11px] font-extrabold text-rose-800">즐겨찾기</div>
                </div>
              </div>
              <div class="space-y-2.5 pt-2 border-t-2 border-dashed border-amber-200">${chBreakdown}</div>
            </div>

            <!-- Badges -->
            <div class="md:col-span-5 bg-white rounded-3xl comic-card p-5 space-y-4 flex flex-col justify-between">
              <div class="space-y-3">
                <h2 class="font-title text-xl text-[#222222]">🏆 ${meta.name}가 모은 배지</h2>
                <div class="grid grid-cols-2 gap-2.5">
                  ${badges.map(b => `
                    <div class="p-3 rounded-2xl border-2 border-[#222222] ${b.unlocked ? 'bg-[#FFE033]/50 shadow-[2px_2px_0_#222]' : 'bg-slate-100 opacity-55'} text-center">
                      <div class="text-3xl mb-1">${b.icon}</div>
                      <div class="font-black text-xs text-[#222222]">${b.name}</div>
                      <div class="text-[11px] text-slate-600 font-semibold">${b.desc}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
              <div class="pt-3 border-t-2 border-dashed border-amber-200 flex flex-wrap gap-2 justify-between items-center">
                <button id="btnOpenInstallCard" type="button" class="comic-btn px-3 py-2 rounded-xl bg-sky-100 hover:bg-sky-200 text-[#222222] text-xs font-black">📲 PWA 설치 안내</button>
                <div class="flex gap-2">
                  <button id="btnExportJson" type="button" class="comic-btn px-3 py-2 rounded-xl bg-white hover:bg-amber-50 text-[#222222] text-xs font-black">💾 저장</button>
                  <button id="btnAskReset" type="button" class="comic-btn px-3 py-2 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-800 text-xs font-black">🗑️ 초기화</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Wrong Notes -->
          <div class="bg-white rounded-3xl comic-card p-5">
            <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
              <h3 class="font-title text-xl text-[#222222]">📝 오답노트 (${wrongList.length}개)</h3>
              ${wrongList.length >= 4 ? '<button id="btnReviewWrongQuiz" type="button" class="comic-btn px-3.5 py-1.5 rounded-xl bg-rose-500 text-white text-xs font-black">오답만 다시 풀기</button>' : ''}
            </div>
            ${wrongList.length === 0
              ? '<p class="text-sm text-slate-600 font-medium">아직 틀린 속담이 없어요! 퀴즈 탭에서 실력을 뽐내 보세요.</p>'
              : `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                   ${wrongList.map(p => `
                     <button type="button" data-open-id="${p.id}" class="wrong-card comic-btn text-left p-3.5 rounded-2xl bg-rose-50 hover:bg-rose-100">
                       <div class="font-black text-sm text-[#222222] mb-0.5">${String(p.id).padStart(2, '0')}. ${escapeHtml(p.t)}</div>
                       <div class="text-xs text-slate-600 line-clamp-1 font-medium">${escapeHtml(p.m)}</div>
                     </button>
                   `).join('')}
                 </div>`
            }
          </div>
        </div>
      `;

      document.getElementById('btnOpenInstallCard').addEventListener('click', openInstallModal);
      document.getElementById('btnExportJson').addEventListener('click', () => {
        const data = JSON.stringify({
          profile: meta.name,
          exportedAt: new Date().toISOString(),
          mastered: [...state.masteredIds],
          favorites: [...state.favoriteIds],
          practiced: [...state.practicedIds]
        }, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `어린이속담_${meta.name}_학습기록.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast(`${meta.name}의 학습 기록 파일을 내려받았어요!`);
      });
      document.getElementById('btnAskReset').addEventListener('click', () => {
        document.getElementById('resetModalTitle').textContent = `${meta.emoji} ${meta.name}의 학습 기록을 초기화할까요?`;
        const m = document.getElementById('confirmModal');
        m.classList.remove('hidden');
        m.classList.add('flex');
      });
      const reviewBtn = document.getElementById('btnReviewWrongQuiz');
      if (reviewBtn) reviewBtn.addEventListener('click', () => {
        state.activeTab = 'quiz';
        startQuiz('meaning', 'wrong');
      });
      container.querySelectorAll('.wrong-card').forEach(c => c.addEventListener('click', () => openProverbModal(Number(c.dataset.openId))));
    }

    // --- Install Modal ---
    function openInstallModal() {
      const modal = document.getElementById('installModal');
      const box = document.getElementById('installModalContent');
      box.innerHTML = `
        <p class="leading-relaxed"><strong>읽으면서 바로 써먹는 어린이 속담</strong>은 스마트폰·태블릿·PC 홈 화면에 설치해 오프라인에서도 앱처럼 쓸 수 있는 <strong>PWA</strong>예요.</p>
        ${deferredInstallPrompt
          ? `<button id="btnTriggerNativeInstall" type="button" class="comic-btn w-full py-3 rounded-2xl bg-[#FF6B4A] text-white font-black text-sm">📲 지금 바로 기기에 설치하기</button>`
          : `<div class="rounded-2xl bg-amber-50 border-2 border-[#222222] p-3.5 space-y-2 text-xs text-slate-700 font-medium">
               <div><strong>📱 아이폰 / 아이패드 (Safari):</strong> 하단 <strong>공유(□↑)</strong> 버튼 → <strong>홈 화면에 추가</strong></div>
               <div><strong>🤖 안드로이드 (Chrome / 삼성 인터넷):</strong> 우측 상단 <strong>메뉴(⋮)</strong> → <strong>앱 설치</strong> 또는 <strong>홈 화면에 추가</strong></div>
               <div><strong>💻 PC (Chrome / Edge):</strong> 주소창 오른쪽 <strong>설치(⊕)</strong> 아이콘 클릭</div>
             </div>`
        }
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      const nativeBtn = document.getElementById('btnTriggerNativeInstall');
      if (nativeBtn && deferredInstallPrompt) {
        nativeBtn.addEventListener('click', async () => {
          deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice;
          deferredInstallPrompt = null;
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        });
      }
    }

    // ==========================================
    // 6. Native Touch Guards, PWA Hooks & Init
    // ==========================================
    document.addEventListener('contextmenu', (e) => {
      if (!e.target || !e.target.closest('input, textarea')) e.preventDefault();
    });
    document.addEventListener('dragstart', (e) => {
      if (!e.target || !e.target.closest('input, textarea')) e.preventDefault();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.modalId !== null) closeProverbModal();
    });

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredInstallPrompt = e;
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      const btn = document.getElementById('btnInstallHeader');
      if (btn) btn.classList.add('hidden');
      showToast('🎉 어린이 속담 앱이 홈 화면에 설치되었어요!');
    });

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      render();

      document.getElementById('btnProfileJunwoo').addEventListener('click', () => switchProfile('junwoo'));
      document.getElementById('btnProfileJiwoo').addEventListener('click', () => switchProfile('jiwoo'));

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          playTone('tap');
          state.activeTab = btn.dataset.tab;
          persistUIState();
          render();
        });
      });



      document.getElementById('btnSoundToggle').addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        saveState();
        updateHeaderUI();
        if (state.soundEnabled) playTone('ok');
      });

      document.getElementById('btnQuickQuiz').addEventListener('click', () => {
        playTone('tap');
        state.activeTab = 'quiz';
        startQuiz('situation', 'all');
      });

      document.getElementById('btnInstallHeader').addEventListener('click', openInstallModal);
      document.getElementById('btnCloseInstall').addEventListener('click', () => {
        const m = document.getElementById('installModal');
        m.classList.add('hidden');
        m.classList.remove('flex');
      });

      document.getElementById('proverbModal').addEventListener('click', e => {
        if (e.target.id === 'proverbModal') closeProverbModal();
      });

      document.getElementById('btnCancelReset').addEventListener('click', () => {
        const m = document.getElementById('confirmModal');
        m.classList.add('hidden');
        m.classList.remove('flex');
      });
      document.getElementById('btnConfirmReset').addEventListener('click', () => {
        state.masteredIds.clear();
        state.favoriteIds.clear();
        state.wrongIds.clear();
        state.practicedIds.clear();
        state.bestStreak = 0;
        saveState();
        const m = document.getElementById('confirmModal');
        m.classList.add('hidden');
        m.classList.remove('flex');
        showToast(`${getActiveProfileMeta().name}의 학습 기록을 초기화했어요.`);
        render();
      });
    });
  </script>
</body>
</html>
